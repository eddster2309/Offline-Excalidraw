# Test reverse proxy for USERNAME_HEADER: basic auth stands in for your real
# SSO/auth proxy. nginx authenticates the user and sets X-Forwarded-User
# itself, so whatever the browser sends in that header is overwritten.
server {
    listen 8080;

    auth_basic "excalidraw-offline (test users: alice, bob, carol)";
    auth_basic_user_file /etc/nginx/htpasswd;

    # large scenes, images and libraries
    client_max_body_size 50m;

    location / {
        proxy_pass http://excalidraw:3000;
        proxy_http_version 1.1;

        # the important line: overwrite any client-supplied copy
        proxy_set_header X-Forwarded-User $remote_user;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websockets for /socket.io/ (live collaboration)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # /healthz without a login, for the container healthcheck
    location = /healthz {
        auth_basic off;
        proxy_pass http://excalidraw:3000;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
