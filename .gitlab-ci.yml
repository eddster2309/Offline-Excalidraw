# Pipeline: test that the patch series apply and the result works, then build and
# push the image to the GitLab container registry. See docs/CI.md.
stages: [test, build]

workflow:
  rules:
    # Avoid duplicate branch + MR pipelines.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH
      when: never
    - when: always

variables:
  # Scheduled/manual drift checks set these (e.g. UPSTREAM_REF=master).
  UPSTREAM_REF: ""
  LIBRARIES_REF: ""

# ---- tests ----------------------------------------------------------------
.test-patches:
  stage: test
  image: $HARBOR_DOCKER/library/node:22-bookworm
  tags: [jack-cbr]
  timeout: 1h
  variables:
    # Everything cache-like lives inside the project dir so GitLab can cache it.
    CACHE_DIR: $CI_PROJECT_DIR/.cache
  cache:
    - key: {prefix: yarn, files: [UPSTREAM_COMMIT]}
      paths: [.cache/yarn]
    - key: {prefix: npm, files: [server/package-lock.json, e2e/package-lock.json]}
      paths: [.cache/npm]
    - key: {prefix: playwright, files: [e2e/package-lock.json]}
      paths: [.cache/ms-playwright]
  script:
    - scripts/ci-test.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/app
      - dist/libraries
      - reports/playwright-report
      - reports/test-results
    reports:
      junit: reports/e2e-junit.xml

test:patches:
  extends: .test-patches
  rules:
    - if: ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web") && ($UPSTREAM_REF != "" || $LIBRARIES_REF != "")
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_TAG

# Weekly drift check: same as test:patches but against UPSTREAM_REF (and/or
# LIBRARIES_REF); fails when the series no longer applies or the tests break.
test:upstream-drift:
  extends: .test-patches
  allow_failure: false
  rules:
    - if: ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web") && ($UPSTREAM_REF != "" || $LIBRARIES_REF != "")
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/playwright-report
      - reports/test-results
    reports:
      junit: reports/e2e-junit.xml

# ---- image ------------------------------------------------------------------
# docker-build is rootless BuildKit; image goes to the GitLab registry (the
# component's defaults). Dockerfile.ci just packages the dist/ built and tested above.
include:
  # merge requests: build only, nothing is pushed
  - component: $CI_SERVER_FQDN/cicd-components/basics/docker-build@main
    inputs:
      job_name: build:mr
      push: "false"
      dockerfile: Dockerfile.ci
      build_args: BASE_REGISTRY=$HARBOR_DOCKER
      rules: [{if: '$CI_PIPELINE_SOURCE == "merge_request_event"'}]
  # default branch: <short sha> + latest
  - component: $CI_SERVER_FQDN/cicd-components/basics/docker-build@main
    inputs:
      job_name: build
      dockerfile: Dockerfile.ci
      build_args: BASE_REGISTRY=$HARBOR_DOCKER
      rules: [{if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]
  # git tags: <tag> + <short sha>
  - component: $CI_SERVER_FQDN/cicd-components/basics/docker-build@main
    inputs:
      job_name: build:tag
      image_tags: "$CI_COMMIT_TAG,$CI_COMMIT_SHORT_SHA"
      dockerfile: Dockerfile.ci
      build_args: BASE_REGISTRY=$HARBOR_DOCKER
      rules: [{if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_TAG'}]
  - component: $CI_SERVER_FQDN/cicd-components/basics/sbom@main
    inputs:
      job_name: sbom
      needs_job: build
      rules: [{if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]
  - component: $CI_SERVER_FQDN/cicd-components/basics/sbom@main
    inputs:
      job_name: sbom:tag
      needs_job: build:tag
      rules: [{if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_TAG'}]
  - component: $CI_SERVER_FQDN/cicd-components/basics/semgrep@main
    inputs:
      rules:
        - {if: '$CI_PIPELINE_SOURCE == "merge_request_event"'}
        - {if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}
        - {if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_TAG'}

# Build jobs wait for the tests and take the tested dist/ from them. These merge
# into the jobs generated by the components (their own artifacts/dotenv stay).
.after-tests:
  needs:
    - job: test:patches
      artifacts: true
build:mr:
  extends: .after-tests
build:
  extends: .after-tests
build:tag:
  extends: .after-tests
